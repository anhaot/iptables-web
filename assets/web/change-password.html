<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iptables-web · 首次登录改密</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --brand: #4f46e5;
      --brand-light: #6366f1;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #ffffff;
      --background: #eef2ff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.13), transparent 34%),
        var(--background);
      font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    .card {
      width: min(100%, 460px);
      padding: 2.5rem;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(30, 41, 59, 0.14);
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 1.5rem;
      color: #fff;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--brand), var(--brand-light));
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.28);
    }

    .logo svg { width: 30px; height: 30px; }
    h1 { margin: 0 0 0.65rem; font-size: 1.65rem; }
    .intro { margin: 0 0 1.75rem; color: var(--muted); line-height: 1.7; font-size: 0.92rem; }

    .notice {
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      color: #3730a3;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .field { margin-bottom: 1.15rem; }
    label { display: block; margin-bottom: 0.45rem; font-size: 0.82rem; font-weight: 650; color: #334155; }
    input {
      width: 100%;
      padding: 0.78rem 0.9rem;
      color: var(--text);
      background: #f8fafc;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      outline: none;
      font: inherit;
    }
    input:focus {
      background: #fff;
      border-color: var(--brand-light);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .error {
      display: none;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: 0.84rem;
    }
    .error.show { display: block; }

    button {
      width: 100%;
      padding: 0.82rem;
      margin-top: 0.25rem;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-light));
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 650;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.24);
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .footnote { margin: 1rem 0 0; color: #94a3b8; text-align: center; font-size: 0.78rem; }

    @media (max-width: 520px) {
      body { padding: 0; background: #fff; }
      .card { min-height: 100vh; padding: 2rem 1.4rem; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3 5.5 5.6v5.7c0 4.2 2.7 7.9 6.5 9.7 3.8-1.8 6.5-5.5 6.5-9.7V5.6L12 3Z"/>
        <path d="m9.2 12 1.8 1.8 3.9-4"/>
      </svg>
    </div>
    <h1>首次登录，请修改密码</h1>
    <p class="intro">当前账号使用的是管理员分配的初始密码。完成修改前，系统不会开放规则、用户、备份或其他管理接口。</p>
    <div class="notice">修改成功后，当前会话将退出。请使用新密码重新登录。</div>
    <div id="password-error" class="error"></div>

    <form id="password-form" onsubmit="return changePassword(event)">
      <input id="password-username" type="text" autocomplete="username" hidden>
      <div class="field">
        <label for="old-password">当前密码</label>
        <input id="old-password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="field">
        <label for="new-password">新密码</label>
        <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm-password">确认新密码</label>
        <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <button id="submit-button" type="submit">修改密码并重新登录</button>
    </form>
    <p class="footnote">密码至少 6 个字符，且不能与当前密码相同。</p>
  </main>

  <script>
    function token() {
      return sessionStorage.getItem('auth_token') || '';
    }

    function showError(message) {
      var error = document.getElementById('password-error');
      error.textContent = message;
      error.className = 'error show';
    }

    async function verifySession() {
      if (!token()) {
        window.location.href = '/login.html';
        return;
      }
      try {
        var response = await fetch('/api/v1/auth/session', {
          headers: { 'Authorization': 'Bearer ' + token() }
        });
        if (!response.ok) {
          sessionStorage.clear();
          window.location.href = '/login.html';
          return;
        }
        var result = await response.json();
        document.getElementById('password-username').value = (result.data && result.data.username) || '';
        if (!result.data || !result.data.requires_password_change) {
          window.location.href = '/index.html';
        }
      } catch (error) {
        showError('无法检查当前会话，请稍后重试。');
      }
    }

    async function changePassword(event) {
      event.preventDefault();
      var oldPassword = document.getElementById('old-password').value;
      var newPassword = document.getElementById('new-password').value;
      var confirmPassword = document.getElementById('confirm-password').value;
      var button = document.getElementById('submit-button');

      if (newPassword !== confirmPassword) {
        showError('两次输入的新密码不一致。');
        return false;
      }
      if (newPassword.length < 6) {
        showError('新密码长度至少 6 个字符。');
        return false;
      }

      button.disabled = true;
      button.textContent = '正在修改...';
      try {
        var response = await fetch('/api/v1/auth/password', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token(),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
        });
        var result = await response.json();
        if (!response.ok) {
          showError(result.error ? result.error.message : '密码修改失败。');
          button.disabled = false;
          button.textContent = '修改密码并重新登录';
          return false;
        }
        sessionStorage.clear();
        window.location.href = '/login.html?password_changed=1';
      } catch (error) {
        showError('网络连接失败，请稍后重试。');
        button.disabled = false;
        button.textContent = '修改密码并重新登录';
      }
      return false;
    }

    verifySession();
  </script>
</body>
</html>
