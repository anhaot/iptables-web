services:
  iptables-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_PROCS: "2"
    container_name: iptables-web
    # CRITICAL: Host networking is required so iptables commands inside the
    # container modify the HOST's network stack, not the container's isolated
    # network namespace. Without this, the tool would only manage rules in
    # the container's own (minimal) iptables.
    network_mode: "host"
    volumes:
      # Persistent rule storage — survives container restarts AND host reboots
      - iptables-web-data:/data
      # Optional: mount Docker socket to auto-detect container port mappings
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_ADMIN      # Required for modifying iptables rules
      - NET_RAW        # Required for iptables rule checking
    cap_drop:
      - ALL            # Drop all other capabilities (defense in depth)
    security_opt:
      - no-new-privileges:true
    environment:
      # Listen on all IPv4 interfaces. Keep authentication enabled and use
      # firewalld/security groups to restrict who can reach this port.
      - LISTEN_ADDR=${IPTABLES_WEB_LISTEN_ADDR:-0.0.0.0:33801}
      - RULES_FILE=/data/rules.json
      - USERS_FILE=/data/users.json
      - HOSTS_FILE=/data/hosts.json
      - API_KEYS_FILE=/data/api-keys.json
      - AUDIT_FILE=/data/audit.jsonl
      - ROLLBACK_FILE=/data/rollback.json
      - LOG_LEVEL=${IPTABLES_WEB_LOG_LEVEL:-info}
      - TZ=${TZ:-Asia/Shanghai}
      - AUTH_ENABLED=${IPTABLES_WEB_AUTH_ENABLED:-true}
      - FIREWALL_BACKEND=${IPTABLES_WEB_FIREWALL_BACKEND:-auto}
      - DEV_MODE=${IPTABLES_WEB_DEV_MODE:-false}
      # Optional override. By default the controller creates /data/hosts.key
      # automatically; if set, keep this value stable.
      # - HOST_CREDENTIAL_KEY=replace-with-at-least-32-random-characters
      # Create/revoke API access keys dynamically in the UI. Do not persist a
      # plaintext legacy API_KEY in this file or the container environment.
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 8s

volumes:
  iptables-web-data:
    driver: local
